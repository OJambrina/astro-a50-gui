name: Bump version

# Triggers on push to main (= a PR has just been merged). Reads the
# bump:<level> labels of every PR merged since the last v* tag, bumps
# pyproject.toml's [project].version by the highest one, commits the change
# and creates the matching git tag.
#
# Every merge since the last tag, not only the one that triggered the run:
# the concurrency group keeps a single pending run and cancels the one it
# replaces, so a merge landing while a bump runs would otherwise lose its bump.
# The run that does execute checks out the tip of main and picks it up.
#
# No label = no bump: the workflow exits cleanly without touching anything.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # BUMP_TOKEN is a PAT (classic, scope=repo) owned by an admin.
      # Required because the bump commit + tag push to main bypass the
      # repository ruleset via the admin actor — the default
      # GITHUB_TOKEN runs as github-actions[bot], which has no bypass
      # and would be rejected by branch protection.
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Skip if HEAD already tagged
        id: check
        run: |
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve bump type from merged PR labels
        if: steps.check.outputs.skip == 'false'
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First-parent commits of main since the last v* tag (all of main if
          # there is none). The bump and PKGBUILD commits have no PR: level none.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE=${LAST_TAG:+$LAST_TAG..}HEAD
          HEAD_SHA=$(git rev-parse HEAD)
          TYPE=none
          rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }
          for SHA in $(git rev-list --first-parent "$RANGE"); do
            # GitHub links a commit to its PR asynchronously: retry briefly for
            # the newest commit only (older ones are linked by now).
            TRIES=1; [ "$SHA" = "$HEAD_SHA" ] && TRIES=6
            PR=
            for attempt in $(seq "$TRIES"); do
              PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')
              [ -n "$PR" ] && break
              [ "$attempt" -lt "$TRIES" ] && sleep 5
            done
            [ -z "$PR" ] && continue
            LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
            LEVEL=none
            if   echo "$LABELS" | grep -q "bump:major"; then LEVEL=major
            elif echo "$LABELS" | grep -q "bump:minor"; then LEVEL=minor
            elif echo "$LABELS" | grep -q "bump:patch"; then LEVEL=patch
            fi
            echo "PR #$PR ($SHA): $LEVEL"
            [ "$(rank "$LEVEL")" -gt "$(rank "$TYPE")" ] && TYPE=$LEVEL
          done
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $TYPE (since ${LAST_TAG:-the first commit})"

      - name: Compute new version
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          # Match the [project] table's version field. The regex assumes
          # the canonical format: `version = "X.Y.Z"` on its own line.
          CURRENT=$(grep -E '^version = "[0-9]+\.[0-9]+\.[0-9]+"' pyproject.toml \
                    | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ -z "$CURRENT" ]; then
            echo "::error::could not parse version from pyproject.toml"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT → $NEW"

      - name: Update pyproject.toml
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          # Rewrite only the first matching line — narrow enough to not
          # disturb any future occurrence of the same string elsewhere.
          sed -i "0,/^version = \"$CURRENT\"$/ s//version = \"$NEW_VERSION\"/" pyproject.toml
          grep -q "^version = \"$NEW_VERSION\"" pyproject.toml \
            || { echo "::error::sed rewrite did not apply"; exit 1; }

      - name: Configure git
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, push
        if: steps.check.outputs.skip == 'false' && steps.bump.outputs.type != 'none'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          git add pyproject.toml
          git commit -m "chore: bump version to $NEW_VERSION ($BUMP_TYPE)"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin HEAD:main --no-verify
          git push origin "v$NEW_VERSION" --no-verify
